name: Publish compatibility prototype
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified successful probe artifact
        run: |
          set -eu
          gh api repos/KOPOHA-MACOHA/fptn-keenetic/actions/runs/40167013608/jobs --jq '.jobs[] | select(.name == "client") | .conclusion' | grep -qx success
          gh api repos/KOPOHA-MACOHA/fptn-keenetic/actions/artifacts/12589576599/zip > client.zip
          echo '128139ceaf85277ec8bf5480926680099af5ad7ff8fa857a4840afbf160a0842  client.zip' | sha256sum -c -
          mkdir payload
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile("client.zip") as archive:
              for name in ["fptn-client-cli", "SHA256SUMS", "sources.lock.json", "HELP.txt", "LICENSE-FPTN"]:
                  pathlib.Path("payload", name).write_bytes(archive.read(name))
          PY
          cd payload
          sha256sum -c SHA256SUMS
      - name: Publish compatibility diagnostic only
        run: |
          set -eu
          cat > notes.md <<'EOF'
          FPTN CLI compatibility prototype for Keenetic Hopper KN-3810 EAEU.
          MIPS32r2 little-endian / o32 / soft-float / fully static musl.
          Static ELF validation and FPTN --help passed under MIPS QEMU.
          Connection is blocked in code before network initialization; use only --help / --version.
          Not yet a working router VPN: routing, DNS, TLS connections and load have not been tested on hardware.
          Built from commit f09f9c81c4cc0afab6f17d1ac458ee1cc90c34cf.
          EOF
          gh release create client-prototype-f09f9c8 payload/fptn-client-cli payload/SHA256SUMS payload/sources.lock.json payload/HELP.txt payload/LICENSE-FPTN --target f09f9c81c4cc0afab6f17d1ac458ee1cc90c34cf --prerelease --title "Hopper FPTN CLI prototype (connection disabled)" --notes-file notes.md
