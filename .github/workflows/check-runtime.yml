name: Check runtime and panel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact candidate commit created by the upstream checker
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: runtime-${{ inputs.source-ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Prepare PHP and lighttpd integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cgi lighttpd libboost-dev iproute2 iptables
          php-cgi -n -v
      - name: Verify real IPv4/IPv6 socket binding and endpoint fallback
        run: sudo --preserve-env=PATH python3 -m unittest discover -s tests -p 'test_native_transport.py' -v
      - name: Verify WAN selection in isolated Linux network namespaces
        run: sudo --preserve-env=PATH env FPTN_REQUIRE_NETNS=1 python3 -m unittest discover -s tests -p 'test_uplink_namespaces.py' -v
      - name: Verify experimental IPv6 NAT request/reply and firmware lifecycle
        run: |
          python3 -m unittest discover -s tests -p 'test_ipv6_lifecycle.py' -v
          sudo --preserve-env=PATH env FPTN_REQUIRE_NETNS=1 python3 -m unittest discover -s tests -p 'test_ipv6_nat_kernel.py' -v
      - name: Verify isolated bootstrap on the runner with PHP and lighttpd installed
        run: python3 -m unittest discover -s tests -p 'test_bootstrap.py' -v
      - name: Verify discovery and invalidation of client capabilities
        run: python3 -m unittest discover -s tests -p 'test_client_capabilities.py' -v
      - name: Verify client identity and binary update rollback
        run: |
          python3 -m unittest discover -s tests -p 'test_client_identity.py' -v
          python3 -m unittest discover -s tests -p 'test_web_installer.py' -v
          python3 -m unittest discover -s tests -p 'test_web_update.py' -v
      - name: Verify real lighttpd entry and authentication endpoints
        run: python3 -m unittest discover -s tests -p 'test_lighttpd_entry.py' -v
      - name: Verify interrupted operations and credential changes
        run: |
          python3 -m unittest discover -s tests -p 'test_web_operations.py' -v
          python3 -m unittest discover -s tests -p 'test_web_auth.py' -v
      - name: Verify bounded favorite transport fallback
        run: sudo --preserve-env=PATH python3 -m unittest discover -s tests -p 'test_transport_plan.py' -v
      - name: Verify transport options and MTU rollback
        run: |
          sudo --preserve-env=PATH python3 -m unittest discover -s tests -p 'test_native_transport_options.py' -v
          python3 -m unittest discover -s tests -p 'test_web_ui.py' -v
      - name: Verify scripts, UI, credentials and upgrade rollback
        run: |
          python3 scripts/package-web.py --check
          python3 -m unittest discover -s tests -p 'test_web_auth.py' -v
          python3 -m compileall -q scripts
          sudo --preserve-env=PATH python3 -m unittest discover -s tests -v
  package:
    needs: test
    if: inputs.source-ref == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Download the pinned client and decoder without rebuilding dependencies
        run: |
          set -eu
          mkdir output
          : > output/SHA256SUMS
          for platform in mipsel-mips32r2-softfloat $(jq -r '.platforms|keys[]' platform-releases.json); do
            case "$platform" in mipsel-mips32r2-softfloat|aarch64|armv7-softfloat) ;; *) exit 1 ;; esac
            stage="$RUNNER_TEMP/runtime-$platform"
            mkdir -p "$stage/client" "$stage/decoder" "$stage/output"
            if [ "$platform" = mipsel-mips32r2-softfloat ]; then
              client="native-$(jq -r .buildRevision client-release.json)"
              decoder=$(jq -r .decoderRelease runtime-assets.json)
            else
              client=$(jq -r --arg p "$platform" '.platforms[$p].assets.clientRelease' platform-releases.json)
              decoder=$(jq -r --arg p "$platform" '.platforms[$p].assets.decoderRelease' platform-releases.json)
            fi
            for asset in fptn-client-cli sources.lock.json LICENSE-FPTN; do
              gh release download "$client" --pattern "$asset" --dir "$stage/client"
            done
            for asset in brotli LICENSE-BROTLI BROTLI-SOURCE.txt; do
              gh release download "$decoder" --pattern "$asset" --dir "$stage/decoder"
            done
            python3 scripts/package-runtime.py . "$stage/client" "$stage/decoder" "$stage/output" "$GITHUB_SHA" "$platform"
            cat "$stage/output/SHA256SUMS" >> output/SHA256SUMS
            mv "$stage/output/"*.tar.gz output/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fptn-keenetic-install
          path: |
            output/*.tar.gz
            output/SHA256SUMS
          if-no-files-found: error
      - name: Publish the tested complete runtime package
        run: |
          set -eu
          tag="runtime-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "FPTN Keenetic runtime ${GITHUB_SHA:0:7}" \
              --notes 'Complete install/update packages for registered Entware architectures. Exact client/decoder and source metadata, panel and service are included. Runtime tests passed in Actions; foreign-architecture CLI/probes are tested under QEMU, not live ARM hardware. Run sh install.sh install inside the extracted folder. Routes and DNS stay in Keenetic; optional IPv6 NAT66 is off by default.'
          fi
          gh release upload "$tag" output/*.tar.gz output/SHA256SUMS --clobber
