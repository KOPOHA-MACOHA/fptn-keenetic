name: Verify locked dependency images
on:
  push:
    branches: [main]
    paths:
      - 'build-locks/**'
      - 'scripts/dependency-lock.py'
      - 'scripts/import-dependency-image.py'
      - '.github/workflows/verify-dependency-lock.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-dependency-lock-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [mipsel-mips32r2-softfloat, aarch64, armv7-softfloat]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify lock contracts before fetching build data
        run: python3 -m unittest discover -s tests -p test_dependency_lock.py -v
      - uses: docker/setup-buildx-action@v3
      - id: mips
        if: matrix.platform == 'mipsel-mips32r2-softfloat'
        uses: ./.github/actions/dependency-image
        with:
          publish: 'true'
      - id: arm
        if: matrix.platform != 'mipsel-mips32r2-softfloat'
        run: |
          set -euo pipefail
          python3 scripts/render-platform.py . '${{ matrix.platform }}' ports/generated
          key=$(python3 scripts/platform-dependency-key.py ports/generated)
          mkdir -p "$RUNNER_TEMP/arm-deps"
          python3 scripts/arm-dependency-release.py restore '${{ matrix.platform }}' "$key" "$RUNNER_TEMP/arm-deps/dependencies.tar"
          if [ ! -s "$RUNNER_TEMP/arm-deps/dependencies.tar" ]; then
            python3 scripts/import-dependency-image.py '${{ matrix.platform }}' "$key" "$RUNNER_TEMP/arm-deps/dependencies.tar"
          fi
          # This verification intentionally never compiles ARM dependencies.
          test -s "$RUNNER_TEMP/arm-deps/dependencies.tar"
          uri=$(python3 scripts/dependency-image.py unpack "$RUNNER_TEMP/arm-deps/dependencies.tar" "$RUNNER_TEMP/arm-layout")
          echo "context=$uri" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Export committed fork sources
        run: python3 scripts/export-fork-source.py out/fork-source
      - name: Validate the graph and tools, compile CLI, verify ABI and emulate offline modes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.platform == 'mipsel-mips32r2-softfloat' && 'Dockerfile' || 'ports/generated/Dockerfile' }}
          target: client-export
          build-args: DEPENDENCIES_IMAGE=prepared-dependencies
          build-contexts: |
            prepared-dependencies=${{ steps.mips.outputs.context || steps.arm.outputs.context }}
            fork-source=./out/fork-source
          outputs: type=local,dest=out/locked-client
          provenance: false
          sbom: false
      - name: Preserve verified ARM imports under their new exact keys
        if: matrix.platform != 'mipsel-mips32r2-softfloat'
        run: python3 scripts/arm-dependency-release.py publish '${{ matrix.platform }}' '${{ steps.arm.outputs.key }}' "$RUNNER_TEMP/arm-deps/dependencies.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: locked-client-${{ matrix.platform }}
          path: out/locked-client/
          if-no-files-found: error
