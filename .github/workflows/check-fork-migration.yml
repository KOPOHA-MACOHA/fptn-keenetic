name: Validate integrated Keenetic fork
on:
  push:
    branches: [migration/keenetic]
permissions:
  contents: read
concurrency:
  group: integrated-keenetic-fork
  cancel-in-progress: false
jobs:
  runtime:
    if: github.repository == 'KOPOHA-MACOHA/fptn-keenetic-next'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare runtime integration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cgi lighttpd libboost-dev libspdlog-dev libfmt-dev python3-yaml iproute2 iptables libarchive-dev libcurl4-openssl-dev pkg-config
      - name: Build the pinned native opkg test tool
        run: sh tests/build-opkg.sh
      - name: Validate the complete runtime suite in the integrated source tree
        run: |
          python3 scripts/package-web.py --check
          python3 -m compileall -q scripts
          sudo --preserve-env=PATH env FPTN_REQUIRE_NETNS=1 FPTN_TEST_OPKG="$FPTN_TEST_OPKG" python3 -m unittest discover -s tests -v
  client:
    if: "!contains(github.event.head_commit.message, '[runtime-only]')"
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [mipsel-mips32r2-softfloat, aarch64, armv7-softfloat]
    env:
      GH_TOKEN: ${{ github.token }}
      # Read the existing public snapshots. This workflow never publishes to it.
      GH_REPO: KOPOHA-MACOHA/fptn-keenetic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export this fork's committed sources and select the locked dependency key
        id: inputs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python3 scripts/export-fork-source.py out/fork-source
          if [ "$PLATFORM" = mipsel-mips32r2-softfloat ]; then
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
            echo "key=$(python3 scripts/dependency-image.py key .)" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/render-platform.py . "$PLATFORM" ports/generated
            echo "file=ports/generated/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "key=$(python3 scripts/platform-dependency-key.py ports/generated)" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore and verify the existing dependency image; fail if missing
        id: dependencies
        env:
          PLATFORM: ${{ matrix.platform }}
          INPUT_KEY: ${{ steps.inputs.outputs.key }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dependencies/dependencies.tar"
          python3 scripts/arm-dependency-release.py restore "$PLATFORM" "$INPUT_KEY" "$archive"
          test -s "$archive"
          uri=$(python3 scripts/dependency-image.py unpack "$archive" "$RUNNER_TEMP/dependency-layout")
          echo "context=$uri" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Compile the fork client, check ELF ABI and emulate offline modes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.inputs.outputs.file }}
          target: client-export
          build-args: DEPENDENCIES_IMAGE=prepared-dependencies
          build-contexts: |
            prepared-dependencies=${{ steps.dependencies.outputs.context }}
            fork-source=./out/fork-source
          outputs: type=local,dest=out/client
          provenance: false
          sbom: false
      - name: Attach the exact source provenance
        run: cp out/fork-source/FORK-SOURCE.json out/client/
      - uses: actions/upload-artifact@v4
        with:
          name: fork-client-${{ matrix.platform }}
          path: out/client/
          if-no-files-found: error
