name: Build prototype
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/publish-probe.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Python and workflow configuration
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build and emulate platform probe
        uses: docker/build-push-action@v6
        with:
          context: .
          target: probe-export
          outputs: type=local,dest=out/probe
          cache-from: |
            type=gha,scope=keenetic-client
            type=gha,scope=keenetic-toolchain
          cache-to: type=gha,mode=max,scope=keenetic-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-mipsel-probe
          path: out/probe/
          if-no-files-found: error
  client:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Cross-build FPTN CLI
        uses: docker/build-push-action@v6
        with:
          context: .
          target: client-export
          outputs: type=local,dest=out/client
          cache-from: |
            type=gha,scope=keenetic-client
            type=gha,scope=keenetic-toolchain
          cache-to: type=gha,mode=max,scope=keenetic-client
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-mipsel-client
          path: out/client/
          if-no-files-found: error
