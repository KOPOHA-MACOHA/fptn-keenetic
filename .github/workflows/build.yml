name: Build prototype
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'web/**'
      - 'scripts/install-web-ui.sh'
      - 'scripts/package-web.py'
      - 'scripts/fptn-native-service.sh'
      - 'scripts/fptn-web-auth.sh'
      - 'scripts/fptn-web-auth.php'
      - 'scripts/fptn-web-operations.php'
      - 'tests/test_web*.py'
      - 'tests/test_native_service.py'
      - 'tests/test_lighttpd_entry.py'
      - '.github/workflows/check-runtime.yml'
      - '.github/workflows/publish-probe.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    # Runtime/UI releases reuse the already verified pinned ELF.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[runtime-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PHP auth tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cgi lighttpd
      - name: Check Python and workflow configuration
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build and emulate platform probe
        uses: docker/build-push-action@v6
        with:
          context: .
          target: probe-export
          outputs: type=local,dest=out/probe
          cache-from: |
            type=gha,scope=keenetic-client
            type=gha,scope=keenetic-toolchain
          cache-to: type=gha,mode=max,scope=keenetic-toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-mipsel-probe
          path: out/probe/
          if-no-files-found: error
  publish-native:
    needs: client
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fptn-native-client
          path: client
      - name: Publish pinned prototype assets for router updater
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="native-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "FPTN Keenetic native prototype ${GITHUB_SHA:0:7}" \
              --notes 'Native prototype for Hopper KN-3810 / Entware mipsel. Includes favorite/excluded server policy, bounded automatic selection, live connection status and login checks without a TUN. Compilation and local tests passed; router validation of this update is still required. Routing, DNS and firewall remain managed by Keenetic.'
          fi
          gh release upload "$tag" client/fptn-client-cli client/SHA256SUMS \
            client/HELP.txt client/LICENSE-FPTN client/sources.lock.json --clobber
  client:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Restore prepared dependency image
        id: dependencies-image
        uses: ./.github/actions/dependency-image
      - name: Cross-build FPTN CLI
        uses: docker/build-push-action@v6
        with:
          context: .
          target: client-export
          build-args: DEPENDENCIES_IMAGE=prepared-dependencies
          build-contexts: prepared-dependencies=${{ steps.dependencies-image.outputs.context }}
          outputs: type=local,dest=out/client
      - uses: actions/upload-artifact@v4
        with:
          name: fptn-native-client
          path: out/client/
          if-no-files-found: error
