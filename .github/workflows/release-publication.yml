name: Publish verified releases
on:
  workflow_run:
    workflows: [Build prototype, Build experimental ARM ports, Check runtime and panel]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify readiness and show the plan without commits or publication
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fptn-release-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'KOPOHA-MACOHA/fptn-keenetic' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      status: ${{ steps.plan.outputs.status }}
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      # Never execute code checked out from an incoming PR or workflow artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify readiness and pin only matching verified architecture builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 scripts/release-publication.py prepare "${args[@]}"
  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'validate'
    permissions:
      contents: write
    # Explicit call is necessary: GITHUB_TOKEN commits do not trigger push workflows.
    uses: ./.github/workflows/check-runtime.yml
    with:
      source-ref: ${{ needs.prepare.outputs.runtime }}
      publish-runtime: true
  promote:
    needs: [prepare, validate]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.status == 'validate' && needs.validate.result == 'success') ||
       (needs.prepare.outputs.status == 'promote' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.runtime }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck main, validation evidence and complete packages before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SHA: ${{ needs.prepare.outputs.runtime }}
        run: python3 scripts/release-publication.py promote --runtime "$RUNTIME_SHA"
