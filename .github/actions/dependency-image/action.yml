name: Restore prepared dependency image
description: Reuse a complete immutable OCI snapshot instead of rerunning Conan.
inputs:
  publish:
    description: Preserve the verified snapshot in Releases (requires contents write).
    default: 'false'
  require-hit:
    description: Fail rather than rebuilding when verifying cross-job reuse.
    default: 'false'
  restore-only:
    description: Refuse dependency compilation if neither cache nor persistent snapshot is available.
    default: 'false'
outputs:
  context:
    description: Verified OCI build-context URI.
    value: ${{ steps.unpack.outputs.context }}
  key:
    description: Content key of dependency inputs.
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: Whether this run restored an existing dependency image.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        echo "key=$(python3 scripts/dependency-image.py key .)" >> "$GITHUB_OUTPUT"
        mkdir -p "$RUNNER_TEMP/fptn-dependency-cache"
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/fptn-dependency-cache/dependencies.tar
        key: fptn-deps-oci-v1-${{ steps.key.outputs.key }}
        fail-on-cache-miss: ${{ inputs.require-hit }}
    - if: inputs.require-hit == 'true' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo 'Expected a dependency image cache hit; refusing to compile dependencies.' >&2
        exit 1
    - id: release-dependencies
      if: steps.restore.outputs.cache-hit != 'true' && inputs.require-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 scripts/arm-dependency-release.py restore mipsel-mips32r2-softfloat '${{ steps.key.outputs.key }}' "$RUNNER_TEMP/fptn-dependency-cache/dependencies.tar"
    - name: Refuse a cold rebuild when a prepared image is required
      if: (inputs.restore-only == 'true' || hashFiles('build-locks/source-reuse.json') != '') && steps.restore.outputs.cache-hit != 'true' && steps.release-dependencies.outputs.restored != 'true'
      shell: bash
      run: |
        echo 'Prepared dependency snapshot is required; refusing a cold dependency build.' >&2
        exit 1
    - id: seed
      if: steps.restore.outputs.cache-hit != 'true' && steps.release-dependencies.outputs.restored != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 scripts/seed-conan-cache.py "$RUNNER_TEMP/conan-seed/dependencies.tar"
    - if: steps.restore.outputs.cache-hit != 'true' && steps.release-dependencies.outputs.restored != 'true'
      name: Prepare dependency snapshot (only on input-key change or missing cache)
      uses: docker/build-push-action@v6
      with:
        context: .
        target: dependency-image
        build-args: CONAN_SEED_IMAGE=${{ steps.seed.outputs.context != '' && 'shared-conan-seed' || 'empty-conan-seed' }}
        build-contexts: ${{ steps.seed.outputs.context != '' && format('shared-conan-seed={0}', steps.seed.outputs.context) || '' }}
        provenance: false
        sbom: false
        outputs: type=oci,dest=${{ runner.temp }}/fptn-dependency-cache/dependencies.tar
        cache-from: |
          type=gha,scope=keenetic-dependencies
          type=gha,scope=keenetic-client
          type=gha,scope=keenetic-toolchain
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/fptn-dependency-cache/dependencies.tar
        key: fptn-deps-oci-v1-${{ steps.key.outputs.key }}
    - id: unpack
      shell: bash
      run: |
        set -euo pipefail
        du -h "$RUNNER_TEMP/fptn-dependency-cache/dependencies.tar"
        context=$(python3 scripts/dependency-image.py unpack \
          "$RUNNER_TEMP/fptn-dependency-cache/dependencies.tar" \
          "$RUNNER_TEMP/fptn-dependency-layout")
        echo "context=$context" >> "$GITHUB_OUTPUT"
        echo 'Prepared dependency image verified; Conan installation will not run in the client build.'
    - name: Preserve the verified MIPS image outside the disposable Actions cache
      if: inputs.publish == 'true' && github.repository == 'KOPOHA-MACOHA/fptn-keenetic' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: python3 scripts/arm-dependency-release.py publish mipsel-mips32r2-softfloat '${{ steps.key.outputs.key }}' "$RUNNER_TEMP/fptn-dependency-cache/dependencies.tar"
